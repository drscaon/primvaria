<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="description" content="{description}">
<link rel="canonical" href="{url}">
<meta name="robots" content="index, follow">
{jsonld}
<meta property="og:title" content="{title}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Primvaria">
<meta property="og:description" content="{description}">
<meta property="og:image" content="https://primvaria.com/social_preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:url" content="{url}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="/"><img src="/favicon.svg" alt="">Primvaria</a>
  <nav>
    <a href="/#generators">Generators</a>
    <a href="/engines/">Engines</a>
    <a href="/contract/">Contract</a>
    <a class="hide-s" href="/mission/">Mission</a>
    <a href="https://github.com/drscaon/primvaria">GitHub</a>
    <a class="hide-s" href="mailto:contact@primvaria.com">Contact</a>
  </nav>
</div></header>

<main id="top">
{content}
</main>

<footer><div class="wrap">
  <span>Primvaria · MIT © 2026 Daniel Régis Sarmento Caon</span>
  <span><a href="mailto:contact@primvaria.com">contact@primvaria.com</a> · <a href="/mission/">Mission</a> · <a href="/contract/">OpenUSD contract</a> · <a href="https://github.com/drscaon/primvaria">GitHub</a> · <a href="https://pypi.org/project/primvaria/">PyPI</a></span>
</div></footer>

<script>
document.querySelectorAll("button[data-copy]").forEach((button) => button.addEventListener("click", async (e) => {
  const source = document.getElementById(button.dataset.copy);
  try { await navigator.clipboard.writeText(source.textContent); e.target.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(source);
          const s = getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent = "Selected"; }
  setTimeout(() => (e.target.textContent = "Copy"), 1600);
}));
</script>
</body>
</html>
