name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # weekly: the shared-files guard also watches the generators' repositories

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"  # the version of generator-checks.yml
      - run: ruff check .
      - run: ruff format --check .

  shared-files:
    name: The four generators share their files and agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_shared_files.py
      - run: python scripts/check_consistency.py
        env:
          GITHUB_TOKEN: ${{ github.token }}  # the API's limit for anonymous calls is shared by runners

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The generators' main branches, so that the suite is tested against
      # what will be released next (and works before they are on PyPI).
      - name: Install the generators from GitHub
        run: >
          pip install
          "granulaire @ git+https://github.com/drscaon/granulaire"
          "maillage[sim] @ git+https://github.com/drscaon/maillage"
          "filaire[sim] @ git+https://github.com/drscaon/filaire"
          "quincaillerie @ git+https://github.com/drscaon/quincaillerie"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Command-line smoke test
        run: |
          primvaria --version
          primvaria list
          primvaria granulaire generate --preset crushed_gravel --shapes 5 --copies 2 --out ci-output
          primvaria filaire generate --preset usb_c --count 1 --out ci-output

  macos:
    # Not on pull requests, only after the commits reach main: GitHub's hosted macOS
    # runners are often not available, and a job waiting for one blocks pull requests.
    name: Tests (Python 3.12, macos-latest)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the generators from GitHub
        run: >
          pip install
          "granulaire @ git+https://github.com/drscaon/granulaire"
          "maillage[sim] @ git+https://github.com/drscaon/maillage"
          "filaire[sim] @ git+https://github.com/drscaon/filaire"
          "quincaillerie @ git+https://github.com/drscaon/quincaillerie"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  newton:
    name: Newton on CPU, every preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Newton pins its own usd-core and MuJoCo: the packs are written in one environment
      # and read by Newton in another (scripts/newton_check.py).
      - name: Install the generators from GitHub
        run: >
          pip install
          "granulaire @ git+https://github.com/drscaon/granulaire"
          "maillage[sim] @ git+https://github.com/drscaon/maillage"
          "filaire[sim] @ git+https://github.com/drscaon/filaire"
          "quincaillerie @ git+https://github.com/drscaon/quincaillerie"
          -e .
      - name: Write a pack of every preset
        run: python scripts/newton_check.py generate packs
      - name: Install Newton
        run: |
          python -m venv .newton
          .newton/bin/pip install "newton[importers]==1.8.0"
      - name: Check what Newton reads
        run: .newton/bin/python scripts/newton_check.py run packs
      - name: Report
        if: always()
        run: cat packs/newton.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: newton-report
          path: packs/newton.*

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
