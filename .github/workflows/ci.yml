name: CI

# Two levels. On a commit (push to main, pull request): the fast checks, the tests on
# Ubuntu and Python 3.12 and Newton on a sample of the presets. Before a release
# (release.yml calls this workflow with full: true) and with the "Run workflow" button:
# the tests on Linux, Windows and macOS and on every Python, and Newton on every preset.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Every platform, Python and preset (as before a release)
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Every platform, Python and preset
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"  # weekly: the shared-files guard also watches the generators' repositories

permissions:
  contents: read

env:
  FULL: ${{ inputs.full && 'true' || 'false' }}  # read by scripts/newton_check.py

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"  # the version of generator-checks.yml
      - run: ruff check .
      - run: ruff format --check .

  shared-files:
    name: The four generators share their files and agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_shared_files.py
      - run: python scripts/check_consistency.py
        env:
          GITHUB_TOKEN: ${{ github.token }}  # the API's limit for anonymous calls is shared by runners

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # full: every Python on Linux, and Windows and macOS on a recent Python; otherwise
        # Linux and Python 3.12 only
        include: ${{ fromJSON(inputs.full && '[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.12"}]' || '[{"os":"ubuntu-latest","python-version":"3.12"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # primvaria-contract from this repository and the generators' main branches, so that
      # the suite is tested against what will be released next (and works before it is on PyPI).
      - name: Install primvaria-contract from this repository
        run: pip install -e "./contract[dev]"
      - name: Install the generators from GitHub
        run: >
          pip install
          "granulaire @ git+https://github.com/drscaon/granulaire"
          "maillage[sim] @ git+https://github.com/drscaon/maillage"
          "filaire[sim] @ git+https://github.com/drscaon/filaire"
          "quincaillerie @ git+https://github.com/drscaon/quincaillerie"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Test primvaria-contract
        working-directory: contract
        run: pytest
      - name: Command-line smoke test
        run: |
          primvaria --version
          primvaria list
          primvaria granulaire generate --preset crushed_gravel --shapes 5 --copies 2 --out ci-output
          primvaria filaire generate --preset usb_c --count 1 --out ci-output

  newton:
    name: Newton on CPU, the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Newton pins its own usd-core and MuJoCo: the packs are written in one environment
      # and read by Newton in another (scripts/newton_check.py).
      - name: Install primvaria-contract from this repository
        run: pip install -e ./contract
      - name: Install the generators from GitHub
        run: >
          pip install
          "granulaire @ git+https://github.com/drscaon/granulaire"
          "maillage[sim] @ git+https://github.com/drscaon/maillage"
          "filaire[sim] @ git+https://github.com/drscaon/filaire"
          "quincaillerie @ git+https://github.com/drscaon/quincaillerie"
          -e .
      - name: Write a pack of the presets (a sample on a commit)
        run: python scripts/newton_check.py generate packs
      - name: Install Newton
        run: |
          python -m venv .newton
          .newton/bin/pip install "newton[importers]==1.8.0"
      - name: Check what Newton reads
        run: .newton/bin/python scripts/newton_check.py run packs
      - name: Report
        if: always()
        run: cat packs/newton.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: newton-report
          path: packs/newton.*

  simready:
    name: SimReady profile on CPU (a report, not a gate)
    runs-on: ubuntu-latest
    continue-on-error: true  # docs/simready.md says what does not pass, and why
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install primvaria-contract from this repository
        run: pip install -e ./contract
      - name: Install the generators from GitHub
        run: >
          pip install
          "granulaire @ git+https://github.com/drscaon/granulaire"
          "maillage[sim] @ git+https://github.com/drscaon/maillage"
          "filaire[sim] @ git+https://github.com/drscaon/filaire"
          "quincaillerie @ git+https://github.com/drscaon/quincaillerie"
          -e .
      - name: Write a pack of the presets (a sample on a commit)
        run: python scripts/newton_check.py generate packs
      # NVIDIA's validator and the profiles, in their own environment: no Omniverse, Kit or GPU
      - name: Install simready-validate
        run: |
          python -m venv .simready
          .simready/bin/pip install usd-core simready-validate simready-foundation-tier-core
      - name: Check the packs against Robotics-Prop
        run: python scripts/simready_check.py packs --validator .simready/bin/simready-validate
      - name: Report
        if: always()
        run: cat packs/simready.md >> "$GITHUB_STEP_SUMMARY" || true

  build:
    name: Build and check the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m build contract --outdir dist
      - run: twine check --strict dist/*
