name: Generator checks

# The checks every Primvaria generator runs the same way: lint and format, the tests on
# every supported Python and platform with a command-line smoke test, the tests on the
# oldest OpenUSD the package accepts, and the package build. Called from each generator's
# CI workflow, so that the tool versions and the matrix are written once:
#
#   jobs:
#     checks:
#       uses: drscaon/primvaria/.github/workflows/generator-checks.yml@main
#       with:
#         package: granulaire
#         smoke: |
#           granulaire --version
#           granulaire generate --preset crushed_gravel --out ci-output
#
# The engine checks (MuJoCo, Blender, OpenUSD validators on every preset) differ from one
# generator to the next and stay in its own workflow.

on:
  workflow_call:
    inputs:
      package:
        description: Name of the package and of its command (granulaire, maillage, filaire, quincaillerie)
        required: true
        type: string
      smoke:
        description: Plain commands, one per line, run after the tests on every platform (bash and PowerShell)
        required: true
        type: string
      wheel-smoke:
        description: Extra commands run with the built wheel installed in a clean environment, /tmp/venv (bash)
        required: false
        type: string
        default: ""
      usd-floor:
        description: The lowest usd-core version the package accepts
        required: false
        type: string
        default: "26.5"

permissions:
  contents: read

env:
  RUFF: "0.16.9"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==${{ env.RUFF }}"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # one run on each other platform, on a recent Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Command-line smoke test
        # the platform's default shell (PowerShell on Windows), as a user would run them
        run: ${{ inputs.smoke }}

  usd-floor:
    name: Oldest supported OpenUSD (usd-core ${{ inputs.usd-floor }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the lowest usd-core the package accepts
        run: pip install -e ".[dev]" "usd-core==${{ inputs.usd-floor }}"
      - name: Tests (OpenUSD validators included)
        run: |
          python -c "from pxr import Usd; v = Usd.GetVersion(); assert f'{v[1]}.{v[2]}' == '${{ inputs.usd-floor }}', v"
          pytest -q

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/${{ inputs.package }} --version
      - name: Use the installed package
        if: inputs.wheel-smoke != ''
        run: ${{ inputs.wheel-smoke }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
