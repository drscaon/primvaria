name: Release primvaria-contract

# Pushing a tag contract-vX.Y.Z (or a pre-release tag such as contract-v0.1.0b1) tests the
# package on every platform and supported Python, builds it from contract/, publishes it on
# PyPI through Trusted Publishing (no API token), then creates the GitHub release with the
# package attached. Pre-release versions (a, b, rc) are marked as pre-releases.
#
# primvaria-contract goes out before the generators that require its new version, and the
# generators before primvaria.
#
# Running the workflow by hand (Actions > Release primvaria-contract > Run workflow)
# publishes to TestPyPI instead, to rehearse a release.
#
# One-time setup, on pypi.org and test.pypi.org: Account > Publishing > add a pending
# publisher: project "primvaria-contract", owner "drscaon", repository "primvaria",
# workflow "release-contract.yml", environment "pypi-contract" (on TestPyPI:
# "testpypi-contract"). Create both environments in the repository's Settings >
# Environments; restrict "pypi-contract" to tags "contract-v*".

on:
  push:
    tags: ["contract-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "contract-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION in contract/pyproject.toml"
            exit 1
          fi
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: contract/dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi-contract
      url: https://test.pypi.org/p/primvaria-contract
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-contract
      url: https://pypi.org/p/primvaria-contract
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from contract/CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("contract/CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = match.group(1).strip() if match else f"primvaria-contract {version}"
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRERELEASE=""
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then PRERELEASE="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            # --latest=false: the repository's latest release stays primvaria's
            gh release create "$GITHUB_REF_NAME" dist/* $PRERELEASE --latest=false \
              --title "primvaria-contract $VERSION" --notes-file release-notes.md --verify-tag
          fi
